name: macOS app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: hsk-slova-macos
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
